<header id="kopf">
  <div id="bereiche" class="seg" role="group" aria-label="Bereich wählen">
    <button type="button" data-bereich="zeigen">Zeigen</button>
    <button type="button" data-bereich="quiz">Quiz</button>
    <button type="button" data-bereich="sonne"><img class="symbol" src="{{BILD_SONNE}}" alt="">Sonne</button>
  </div>
  <div id="bereich-name" class="bereich-name" hidden></div>
  <div id="digital" aria-label="Uhrzeit digital"><span id="digital-zeit">09:00</span><span id="kopf-satz" class="satz" hidden></span></div>
  <div class="kopf-rechts">
    <button type="button" id="vollbild" class="leise nurikon" aria-label="Vollbild" hidden><svg class="ik"><use href="#i-vollbild"/></svg></button>
    <button type="button" id="einstellungen" class="leise nurikon" aria-label="Einstellungen für die Lehrkraft"><svg class="ik"><use href="#i-einstellungen"/></svg></button>
  </div>
</header>

<div id="fenster" aria-hidden="true"></div>
<svg id="band" aria-hidden="true"></svg>

<svg id="uhr" viewBox="-117 -117 234 234" role="group" aria-label="Analoge Uhr">
  <defs>
    <!-- Pastellflächen mit Licht von links oben; Farben über CSS-Variablen -->
    <radialGradient id="g-ring" cx="38%" cy="30%" r="80%"><stop offset="0" class="s-ring-1"/><stop offset="1" class="s-ring-2"/></radialGradient>
    <radialGradient id="g-blatt" cx="40%" cy="32%" r="78%"><stop offset="0" class="s-blatt-1"/><stop offset="1" class="s-blatt-2"/></radialGradient>
    <!-- weicher Schatten nach unten: die Uhr liegt leicht über dem Himmel, das Zifferblatt leicht über dem Minutenring -->
    <filter id="f-schatten" x="-15%" y="-15%" width="130%" height="135%" color-interpolation-filters="sRGB">
      <feGaussianBlur in="SourceAlpha" stdDeviation="2.4"/><feOffset dy="2.2" result="s"/>
      <feFlood class="f-schattenfarbe"/><feComposite in2="s" operator="in"/>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="f-schatten-klein" x="-10%" y="-10%" width="120%" height="125%" color-interpolation-filters="sRGB">
      <feGaussianBlur in="SourceAlpha" stdDeviation="1.9"/><feOffset dy="1.9" result="s"/>
      <feFlood class="f-schattenfarbe"/><feComposite in2="s" operator="in"/>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <!-- Leuchten der hervorgehobenen Zahl -->
    <!-- Leuchten der hervorgehobenen Zahl in ihrer eigenen Farbe: aufgehellter Schein um die Ziffer -->
    <filter id="f-leuchten" x="-60%" y="-60%" width="220%" height="220%" color-interpolation-filters="sRGB">
      <feGaussianBlur in="SourceGraphic" stdDeviation="1.5" result="b"/>
      <feColorMatrix in="b" type="matrix" values="1 0 0 0 .18  0 1 0 0 .18  0 0 1 0 .18  0 0 0 1.7 0" result="g"/>
      <feMerge><feMergeNode in="g"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <!-- Lichtkante: oben hell, unten unsichtbar -->
    <linearGradient id="g-kante" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff" stop-opacity=".95"/><stop offset=".55" stop-color="#fff" stop-opacity="0"/></linearGradient>
  </defs>
  <circle class="minutenring" cx="0" cy="0" r="116.2" filter="url(#f-schatten)"/>
  <circle class="kante" cx="0" cy="0" r="115.2"/>
  <g id="minutenzahlen" class="minutenzahlen"></g>
  <g id="alleminuten" class="minutenzahlen"></g>
  <g id="innen">
  <circle class="blatt" cx="0" cy="0" r="100" filter="url(#f-schatten-klein)"/>
  <circle class="kante" cx="0" cy="0" r="98.9"/>
  <path id="sektor" class="sektor" d=""/>
  <path id="verg-h" class="verg-h" d=""/>
  <path id="verg-m" class="verg-m" d=""/>
  <g id="striche"></g>
  <g id="start-marke" class="start-marke"><circle r="2.6"/></g>
  <g id="ringe"></g>
  <g id="stundenzahlen" class="stundenzahlen"></g>
  <g id="zeiger-gruppe">
  <g id="zeiger-h" class="zeiger" role="slider" tabindex="0" aria-label="Stundenzeiger" aria-valuemin="0" aria-valuemax="1439">
    <path class="z-stunde" d="M-2.6 12.5 L-4.6 0 L-2.9 -46.5 Q0 -55.5 2.9 -46.5 L4.6 0 L2.6 12.5 Q0 14.2 -2.6 12.5Z"/>
  </g>
  <g id="zeiger-m" class="zeiger" role="slider" tabindex="0" aria-label="Minutenzeiger" aria-valuemin="0" aria-valuemax="1439">
    <path class="z-minute" d="M-1.9 15 L-3.3 0 L-1.25 -82.5 Q0 -89 1.25 -82.5 L3.3 0 L1.9 15 Q0 16.5 -1.9 15Z"/>
  </g>
  <g id="zeiger-s" class="zeiger-s"><line x1="0" y1="17" x2="0" y2="-91"/><circle cx="0" cy="11" r="2.6"/></g>
  </g>
  <circle class="mitte" r="4.4"/><circle class="mitte-punkt" r="1.5"/>
  </g>
  <g id="mfokus" class="minutenzahlen"></g>
</svg>
<div id="lob" aria-hidden="true"><div class="lob-scheibe"><span id="lob-text">Richtig!</span></div></div>

<section id="dock" aria-label="Bedienung"></section>

<div id="entsperren" class="entsperren" hidden>

<section id="blatt-rechts" class="blatt" aria-label="Einstellungen" hidden></section>

<div id="ablage" hidden>
  <!-- ===== Zeigen ===== -->

    <div class="wort-zeile" data-form="hoch"><span class="wort-tag">hochdeutsch</span><span class="wort-text"></span></div>
  </div>
  <div class="block b-seit" id="b-seit" data-teil="zeigen"><p id="seit" class="seit"></p></div>
  <div class="block b-transport" id="b-transport" role="group" aria-label="Zeit laufen lassen" data-teil="zeigen">
    <button type="button" data-lauf="-2" aria-label="Schnell rückwärts"><svg class="ik"><use href="#i-zurueck-schnell"/></svg></button>
    <button type="button" data-lauf="-1" aria-label="Rückwärts"><svg class="ik"><use href="#i-zurueck"/></svg></button>

    <button type="button" data-lauf="2" aria-label="Schnell vorwärts"><svg class="ik"><use href="#i-vor-schnell"/></svg></button>
  </div>
  <div class="block b-aktionen" id="b-aktionen" data-teil="zeigen">

    <button type="button" id="jetzt" class="ikon" aria-pressed="false"><svg class="ik"><use href="#i-jetzt"/></svg><span class="cap">Jetzt</span></button>
    <button type="button" id="start-fest" class="ikon" aria-pressed="false" aria-label="Startzeit festhalten"><svg class="ik"><use href="#i-stoppuhr"/></svg><span class="cap">Start</span></button>
  </div>
  <div class="block b-anzeige" id="b-anzeige" role="group" aria-label="Anzeige" data-teil="zeigen">
    <button type="button" class="hilfe" data-hilfe="digital" aria-pressed="false"><svg class="ik"><use href="#i-digital"/></svg><span class="cap">Digital</span></button>
    <button type="button" class="hilfe" data-hilfe="worte" aria-pressed="false"><svg class="ik"><use href="#i-worte"/></svg><span class="cap">Worte</span></button>
    <button type="button" class="ikon vorlesen" id="vorlesen"><svg class="ik"><use href="#i-lautsprecher"/></svg><span class="cap">Vorlesen</span></button>
  </div>
  <div class="block b-sprechweise seg" id="b-sprechweise" role="group" aria-label="Sprechweise" data-teil="zeigen">
    <button type="button" data-form="sued" aria-label="Süddeutsch"><span class="lang">Süddeutsch</span><span class="kurz">Süd</span></button><button type="button" data-form="hoch" aria-label="Hochdeutsch"><span class="lang">Hochdeutsch</span><span class="kurz">Hoch</span></button><button type="button" data-form="beide">Beide</button>
  </div>
  <div class="block b-stufe" id="b-stufe" data-teil="zeigen" data-lehrkraft>
    <p class="titel klein">Stufe</p>
    <div class="seg" role="group" aria-label="Stufe">
      <button type="button" data-stufe="full">Stunde</button><button type="button" data-stufe="half">halbe</button><button type="button" data-stufe="quarter">Viertel</button><button type="button" data-stufe="five">5 Min.</button><button type="button" data-stufe="any">Minute</button>
    </div>
  </div>
  <div class="block b-hilfen" id="b-hilfen" data-teil="zeigen" role="group" aria-label="Hilfen auf der Uhr">
    <button type="button" class="hilfe" data-hilfe="stunden" aria-pressed="false"><svg class="ik"><use href="#i-stundenzahlen"/></svg><span class="cap">Stunden&shy;zahlen</span></button>
    <button type="button" class="hilfe" data-hilfe="minuten" aria-pressed="false"><svg class="ik"><use href="#i-minutenzahlen"/></svg><span class="cap">Minuten&shy;zahlen</span></button>
    <button type="button" class="hilfe" data-hilfe="alleMinuten" aria-pressed="false"><svg class="ik"><use href="#i-alleminuten"/></svg><span class="cap">Alle Minuten</span></button>
    <button type="button" class="hilfe" data-hilfe="bereich" aria-pressed="false"><svg class="ik"><use href="#i-bereich"/></svg><span class="cap">Stunden&shy;bereich</span></button>
    <button type="button" class="hilfe" data-hilfe="hervorheben" aria-pressed="false"><svg class="ik"><use href="#i-hervorheben"/></svg><span class="cap">Hervor&shy;heben</span></button>
    <button type="button" class="hilfe" data-hilfe="minutenzeiger" aria-pressed="false"><svg class="ik"><use href="#i-minutenzeiger"/></svg><span class="cap">Minuten&shy;zeiger</span></button>
    <button type="button" class="hilfe" data-hilfe="einrasten" aria-pressed="false"><svg class="ik"><use href="#i-einrasten"/></svg><span class="cap">Einrasten</span></button>
  </div>

  <!-- ===== Quiz ===== -->
  <div class="block b-fortschritt" id="b-fortschritt" data-teil="quiz" aria-label="Fortschritt der Runde"></div>
  <div class="block b-kontext" id="b-kontext" data-teil="quiz"><p id="kontext"></p></div>
  <div class="block b-paar" id="b-paar" data-teil="quiz">

    <svg class="pfeil" viewBox="0 0 40 20" aria-label="bis"><path d="M2 10h33M26 3l9 7-9 7"/></svg>
    <span class="zeitkarte" id="paar-ziel"></span>
  </div>
  <div class="block b-frage" id="b-frage" data-teil="quiz" aria-live="polite">
    <p id="frage" class="frage"></p><p id="rueckmeldung" class="rueckmeldung"></p>
  </div>

  <div class="block b-eingabe" id="b-eingabe" data-teil="quiz">

  </div>
  <div class="block b-ziffern" id="b-ziffern" data-teil="quiz sonne" role="group" aria-label="Ziffernfeld"></div>
  <div class="block b-satz" id="b-satz" data-teil="quiz"><p id="satz" class="satz"></p></div>
  <div class="block b-kacheln" id="b-kacheln-nach" data-teil="quiz" role="group" aria-label="Minutenteil, erste Stundenhälfte"></div>
  <div class="block b-kacheln" id="b-kacheln-vor" data-teil="quiz" role="group" aria-label="Minutenteil, zweite Stundenhälfte"></div>
  <div class="block b-stunden" id="b-stunden" data-teil="quiz" role="group" aria-label="Stunde"></div>
  <div class="block b-satzknoepfe" id="b-satzknoepfe" data-teil="quiz">
    <button type="button" id="satz-zurueck">Zurück</button><button type="button" id="satz-pruefen" class="primaer">Prüfen</button>
  </div>
  <div class="block b-vorlesen" id="b-vorlesen2" data-teil="quiz"><button type="button" class="vorlesen">Vorlesen</button></div>
  <div class="block b-nochmal" id="b-nochmal" data-teil="quiz"><button type="button" id="nochmal"><svg class="ik"><use href="#i-nochmal"/></svg><span class="cap">Noch einmal</span></button></div>
  <div class="block b-weiter" id="b-weiter" data-teil="quiz"><button type="button" id="weiter" class="primaer gross"><span class="cap">Los geht’s</span><svg class="ik"><use href="#i-vor"/></svg></button></div>
  <div class="block b-pause" id="b-pause" data-teil="quiz"><button type="button" id="pause" class="leise" aria-label="Pause"><svg class="ik"><use href="#i-pause"/></svg></button></div>

  <!-- ===== Sonne ===== -->

  <div class="block b-tage" id="b-tage" data-teil="sonne">
    <button type="button" data-tage="-1" aria-label="Tag zurück"><svg class="ik"><use href="#i-links"/></svg><span class="cap">Tag</span></button><button type="button" data-tage="1" aria-label="Tag vor"><span class="cap">Tag</span><svg class="ik"><use href="#i-rechts"/></svg></button>
    <button type="button" data-monat="-1" aria-label="Monat zurück"><svg class="ik"><use href="#i-zurueck-schnell"/></svg><span class="cap">Monat</span></button><button type="button" data-monat="1" aria-label="Monat vor"><span class="cap">Monat</span><svg class="ik"><use href="#i-vor-schnell"/></svg></button>
  </div>
  <div class="block b-schnell seg" id="b-schnell" role="group" aria-label="Datum schnell wählen" data-teil="sonne">
