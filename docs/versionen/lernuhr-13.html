LU.ziffernUmstellen=function(el,art,fn){if(el.dataset.art!==art)LU.baueZiffern(el,art,fn);};

function kontextText(){
  const x=q(),E=LU.einst;
  if(LU.s.autoHilfe&&LU.s.autoHilfe.bereich)return {t:'Hilfe: Die Zahl und der Stundenbereich leuchten.',hilfe:true};
  if(LU.s.autoHilfe&&LU.s.autoHilfe.vergangen)return {t:'Hilfe: Die vergangene Zeit ist eingefärbt.',hilfe:true};
  switch(x.phase){
    case 'start':return {t:'Lernstufe: '+LU.STUFEN[E.stufe]+(worte()?' · in Worten, '+LU.formText(E.sprechweise):'')};
    case 'lauf':return {t:'Start '+LU.hm(x.start)+(E.dauerZeigen?' · '+A.durationLabel((LU.s.instant-x.start)/Z.MIN)+' vergangen':'')};
    case 'frage':
      if(bausteine())return {t:x.schritt===2?'Jetzt: die Stunde.':x.schritt==='zahl'?'Wie viele Minuten?':'Zuerst: die Minuten.'};
      if(worte())return {t:'In Worten, '+LU.formText(E.sprechweise)};
      {const t=LU.G&&LU.G.hoch?' · ':'\n';return {t:x.antwort<720?'Vormittags'+t+'0\u00a0bis\u00a011\u00a0Uhr':'Nachmittags oder abends'+t+'12\u00a0bis\u00a023\u00a0Uhr'};}
    default:return {t:''};
  }
}

quiz.digitalSichtbar=function(){const p=q().phase;return p==='start'?LU.s.hilfen.digital:['gut1','dauer','gut2','ende'].includes(p);};

quiz.zeichne=function(){
  const x=q(),E=LU.einst,ph=x.phase,lauf=ph==='lauf';
  // Fortschritt
  const fs=$('b-fortschritt');
  if(fs.childElementCount!==E.runde){fs.replaceChildren();for(let i=0;i<E.runde;i++)fs.appendChild(document.createElement('i'));}
  Array.from(fs.children).forEach((d,i)=>{d.className=i<x.fertig?'fertig':(i===x.fertig&&ph!=='ende'&&ph!=='start'?'jetzt':'');});
  fs.setAttribute('aria-label','Aufgabe '+Math.min(x.fertig+1,E.runde)+' von '+E.runde);
  // Kontext
  const k=kontextText();$('b-kontext').hidden=!k.t;$('kontext').textContent=k.t;$('kontext').classList.toggle('hilfe',!!k.hilfe);
  // Start und Ziel
  const paar=ph==='dauer'||ph==='gut2';$('b-paar').hidden=!paar;
  if(paar){$('paar-start').textContent=LU.hm(x.start);$('paar-ziel').textContent=LU.hm(x.ziel);}
  // Frage und Rückmeldung
  const fr=$('frage'),rm=$('rueckmeldung');fr.classList.remove('loesung');rm.classList.remove('gut');rm.style.whiteSpace='';
  $('b-frage').classList.toggle('kompakt',bausteine()); // Wortbausteine brauchen den Platz
  if(ph==='start'){fr.textContent=E.runde+' Aufgaben';rm.textContent='Die Zeit läuft vorwärts. Welche Uhrzeit ist es dann?';}
  else if(lauf){fr.textContent=x.pause?'Angehalten':'Die Zeit läuft …';rm.textContent=x.pause?'':'Schauen Sie auf die Zeiger.';}
  else if(ph==='frage'){fr.textContent=worte()?'Wie heißt die Uhrzeit?':'Welche Uhrzeit zeigt die Uhr?';rm.textContent=x.meldung;}
  else if(ph==='dauer'){fr.textContent='Wie viel Zeit ist vergangen?';rm.textContent=x.erneut?'Schauen Sie noch einmal zu.':x.meldung;}
  else if(ph==='gut1'){fr.textContent='Richtig!';fr.classList.add('loesung');rm.classList.add('gut');rm.style.whiteSpace='pre-line';rm.textContent='Es ist '+LU.hm(x.ziel)+' Uhr.\n'+loesungWorte();}
  else if(ph==='gut2'){fr.textContent='Richtig!';fr.classList.add('loesung');rm.classList.add('gut');rm.textContent='Es sind '+A.durationLabel(dauer())+' vergangen.';}
  else if(ph==='ende'){fr.textContent='Runde geschafft!';fr.classList.add('loesung');rm.classList.add('gut');rm.textContent=E.runde+' Aufgaben gelöst.';}
  // Antworten
  const leicht=!schwer()&&(ph==='frage'||ph==='dauer');
  $('b-antworten').hidden=!leicht;
  if(leicht){
    const key=ph+'|'+x.optionen.join(',')+'|'+E.sprechweise+'|'+E.aufgabe;
    const box=$('b-antworten');
    if(box.dataset.k!==key){box.dataset.k=key;box.replaceChildren();
      for(const v of x.optionen){const b=document.createElement('button');b.type='button';b.className='antwort';b.dataset.v=v;
        b.textContent=ph==='dauer'?A.durationLabel(v):worte()?W.timeWords(v,E.sprechweise):LU.label(v);
        LU.tippen(b,()=>waehle(v));box.appendChild(b);}
    }
    for(const b of box.children){const v=Number(b.dataset.v),f=x.falsch.has(v);b.classList.toggle('falsch',f);b.disabled=f||x.erneut;b.setAttribute('aria-disabled',String(f));}
  }
  // Ziffernfeld
  const zahlSchritt=bausteine()&&x.schritt==='zahl';
  const zf=(schwer()&&((ph==='frage'&&!worte())||ph==='dauer'))||zahlSchritt;
  $('b-ziffern').hidden=!zf;$('b-eingabe').hidden=!(zf&&!zahlSchritt);
  if(zf){
    LU.ziffernUmstellen($('b-ziffern'),zahlSchritt?'zahl':'zeit',ziffer);
    if(!zahlSchritt){
      $('feld0-name').textContent=ph==='dauer'?'Stunden':'Stunde';$('feld1-name').textContent='Minuten';
      $('feld0').textContent=x.eingabe[0];$('feld1').textContent=x.eingabe[1];
      LU.qa('#b-eingabe .feld').forEach((f,i)=>f.classList.toggle('aktiv',i===x.feld));
      $('feld-trenner').textContent=ph==='dauer'?'':':';
    }
    for(const b of $('b-ziffern').children)b.disabled=!!x.erneut;
  }
  // Wortbausteine
  const bs=bausteine();
  const hoch=LU.G&&LU.G.hoch;$('kopf-satz').hidden=!bs||hoch;$('b-satz').hidden=!bs||!hoch;$('b-kacheln-nach').hidden=!(bs&&x.schritt===1);$('b-kacheln-vor').hidden=!(bs&&x.schritt===1);
  $('b-stunden').hidden=!(bs&&x.schritt===2);$('b-satzknoepfe').hidden=!(bs&&x.schritt!==1);
  if(bs){
    $('kopf-satz').textContent=satzText();$('satz').textContent=satzText();
    const kk=kacheln(),key=E.stufe+'|'+E.sprechweise;
    for(const seite of ['nach','vor']){const box=$('b-kacheln-'+seite);
      if(box.dataset.k!==key){box.dataset.k=key;box.replaceChildren();
        for(const t of kk[seite]){const b=document.createElement('button');b.type='button';b.className='kachel';b.textContent=t.label;
          LU.tippen(b,()=>{const y=q();if(t.count){y.schritt='zahl';y.richtung=t.count;y.zahl='';}else{y.kachel=t;y.schritt=2;}y.meldung='';LU.neu();});box.appendChild(b);}}
    }
    const sb=$('b-stunden');
    if(!sb.childElementCount)W.HOURS.forEach((w,i)=>{const b=document.createElement('button');b.type='button';b.className='kachel';b.textContent=w;b.dataset.i=i;
      LU.tippen(b,()=>{q().stunde=i;LU.neu();});sb.appendChild(b);});
    for(const b of sb.children)b.setAttribute('aria-pressed',String(Number(b.dataset.i)===x.stunde));
    $('satz-pruefen').hidden=x.schritt==='zahl';$('satz-pruefen').disabled=x.stunde==null;
  }
  // Knöpfe
  $('b-vorlesen2').hidden=!(ph==='gut1'||ph==='gut2');
  $('b-weiter').hidden=!(ph==='start'||ph==='gut1'||ph==='gut2'||ph==='ende');
  $('weiter').querySelector('.cap').textContent=ph==='start'?'Los geht’s':ph==='ende'?'Neue Runde':'Weiter';
  $('b-pause').hidden=!lauf;$('pause').querySelector('use').setAttribute('href',x.pause?'#i-vor':'#i-pause');$('pause').setAttribute('aria-label',x.pause?'Weiter laufen':'Pause');
  $('b-nochmal').hidden=ph!=='dauer';$('nochmal').disabled=!!x.erneut;
};
})();

/* js/ui/sonne.js */
/* Bereich Sonne: Datum wählen, Sommer und Winter vergleichen, Tag abspielen, Fakten und Jahresband.
   Die Uhr bleibt bedienbar; Uhrzeit und Sonnenstand sind gekoppelt. */
(function(){
'use strict';
const LU=window.LU,$=LU.$,Z=LU.Z;
const sonne={};LU.sonne=sonne;
const RICHTUNG=['Norden','Nordosten','Osten','Südosten','Süden','Südwesten','Westen','Nordwesten'];
const richtung=(t,place)=>RICHTUNG[Math.round(((SunCalc.getPosition(new Date(t),place.lat,place.lon).azimuth%360)+360)%360/45)%8];

sonne.datum=function(ymd){
  if(!Z.validDate(ymd))return;
  LU.stoppeAlles();
  const m=LU.teile().minutes;LU.s.instant=Z.wallToInstant(ymd,m,LU.zone());LU.neu();
};
function verschiebeMonat(d){
  const p=LU.teile(),dt=new Date(Date.UTC(p.year,p.month-1+d,1)),max=new Date(Date.UTC(dt.getUTCFullYear(),dt.getUTCMonth()+1,0)).getUTCDate();
  dt.setUTCDate(Math.min(p.day,max));sonne.datum(dt.toISOString().slice(0,10));
}
sonne.binden=function(){
  for(const b of LU.qa('[data-tage]'))LU.tippen(b,()=>{LU.s.sonne.vergleich=false;sonne.datum(Z.shiftDate(LU.ymd(),Number(b.dataset.tage)));});
  for(const b of LU.qa('[data-monat]'))LU.tippen(b,()=>{LU.s.sonne.vergleich=false;verschiebeMonat(Number(b.dataset.monat));});
  for(const b of LU.qa('[data-schnell]'))LU.tippen(b,()=>{
    const w=b.dataset.schnell,y=LU.teile().year;
    if(w==='beide'){LU.s.sonne.vergleich=!LU.s.sonne.vergleich;LU.neu();return;}
    LU.s.sonne.vergleich=false;
    sonne.datum(w==='heute'?Z.parts(Date.now(),LU.zone()).ymd:w==='sommer'?y+'-06-21':y+'-12-21');
  });
  LU.tippen($('tagspiel'),()=>{
    const a=LU.s.anim;
    if(a&&a.art==='tag'){a.pause=!a.pause;LU.neu();return;}
    LU.stoppeAlles();
    const p=LU.teile(),ziel=Z.wallToInstant(Z.shiftDate(p.ymd,1),p.minutes,LU.zone());
    LU.animiere({art:'tag',ziel,rate:48,fertig:()=>LU.neu()});LU.neu();
  });
  const jahr=$('jahr');let zieht=null;
  jahr.addEventListener('pointerdown',e=>{if(!e.isPrimary||zieht!=null)return;zieht=e.pointerId;try{jahr.setPointerCapture(e.pointerId);}catch(_){}LU.s.sonne.vergleich=false;sonne.datum(LU.himmel.jahrTag(e));});
  jahr.addEventListener('pointermove',e=>{if(e.pointerId!==zieht)return;const d=LU.himmel.jahrTag(e);if(d!==LU.ymd())sonne.datum(d);});
  const los=e=>{if(e.pointerId===zieht)zieht=null;};
  jahr.addEventListener('pointerup',los);jahr.addEventListener('pointercancel',los);
  jahr.addEventListener('keydown',e=>{const r={ArrowRight:1,ArrowUp:1,ArrowLeft:-1,ArrowDown:-1}[e.key];if(!r)return;e.preventDefault();sonne.datum(Z.shiftDate(LU.ymd(),r));});
};

function karte(titel,ymd){
  const place=LU.s.place,s=Z.solar(ymd,place),m=LU.wandMinuten(),t=Z.wallToInstant(ymd,m,place.zone),alt=LU.himmel.sonnenhoehe(t);
  const k=document.createElement('div');k.className='karte';
  const mini=document.createElement('div');mini.className='mini';mini.style.background=LU.himmel.verlauf(alt);
  if(alt>0){const i=document.createElement('i');i.style.top=(70-Math.min(alt,50)/50*45)+'%';mini.appendChild(i);}
  const txt=document.createElement('div');
  const a=document.createElement('p');a.className='k';a.textContent=titel;
  const b=document.createElement('p');b.textContent=s.sunrise&&s.sunset?Z.clock(s.sunrise,place.zone)+' bis '+Z.clock(s.sunset,place.zone):'—';
  const c=document.createElement('p');c.className='l';c.textContent=Z.duration(s.length)+' hell';
  txt.append(a,b,c);k.append(mini,txt);return k;
}

let vKey='';
sonne.zeichne=function(){
  const s=LU.s,place=s.place,p=LU.teile(),ymd=p.ymd,v=s.sonne.vergleich;
  $('ort-name').textContent=place.name;
  $('datum').textContent=v?'Sommer und Winter':Z.dateLabel(ymd);
  const heute=Z.parts(Date.now(),place.zone).ymd;
  for(const b of LU.qa('[data-schnell]')){const w=b.dataset.schnell;
    b.setAttribute('aria-pressed',String(w==='beide'?v:!v&&(w==='heute'?ymd===heute:w==='sommer'?ymd.slice(5)==='06-21':ymd.slice(5)==='12-21')));}
  const a=s.anim&&s.anim.art==='tag';

  $('tagspiel').querySelector('use').setAttribute('href',a&&!s.anim.pause?'#i-pause':'#i-vor');
  // Fakten
  $('b-fakten').hidden=v;
  if(!v){
    const so=Z.solar(ymd,place);
    const setz=(id,zeit,rest)=>{const d=$(id);d.replaceChildren(zeit);if(rest){const sm=document.createElement('small');sm.textContent=' '+rest;d.appendChild(sm);}};
    if(so.alwaysUp){setz('f-auf','—','geht nicht unter');setz('f-unter','—');}
    else if(so.alwaysDown){setz('f-auf','—','geht nicht auf');setz('f-unter','—');}
    else{setz('f-auf',Z.clock(so.sunrise,place.zone),LU.G&&LU.G.hoch?'':'im '+richtung(+so.sunrise,place));
      setz('f-unter',Z.clock(so.sunset,place.zone),LU.G&&LU.G.hoch?'':'im '+richtung(+so.sunset,place));}
    $('f-laenge').textContent=Z.duration(so.length);
    const alt=LU.himmel.sonnenhoehe(s.instant),mitte=so.solarNoon?Z.parts(+so.solarNoon,place.zone).minutes:720;
    $('f-hoehe').textContent=alt>=1?Math.round(alt)+'° hoch':alt>-.833?(p.minutes<mitte?'geht gerade auf':'geht gerade unter'):alt>-6?'Dämmerung':'untergegangen';
  }
  // Mond
  $('b-mond').hidden=!LU.einst.mond||v;
  if(LU.einst.mond&&!v){
    const mp=SunCalc.getMoonPosition(new Date(s.instant),place.lat,place.lon),ill=SunCalc.getMoonIllumination(new Date(s.instant)),lt=Z.lunar(ymd,place);
    // Zeilen: Phase, Stand, Auf- und Untergang (Zahl und Wort bleiben zusammen)
    const nb=s=>s.replace(/ /g,'\u00a0');
    $('mond-text').textContent=Z.phaseName(ill.phase)+(LU.G&&LU.G.hoch?', ':'\n')+(mp.altitude>0?'über':'unter')+' dem Horizont'+
      (LU.G&&LU.G.hoch?'':'\n'+nb('Aufgang '+(lt.rise?Z.clock(lt.rise,place.zone):'keiner'))+' · '+nb('Untergang '+(lt.set?Z.clock(lt.set,place.zone):'keiner')));
  }
  // Vergleich
  const vb=$('b-vergleich');vb.hidden=!v;
  if(v){const key=[p.year,Math.floor(LU.wandMinuten()/5),place.lat,place.lon].join('|');
    if(key!==vKey){vKey=key;vb.replaceChildren(karte('Sommer · 21. Juni',p.year+'-06-21'),karte('Winter · 21. Dezember',p.year+'-12-21'));
      if(!LU.G.hoch){const d=Z.solar(p.year+'-06-21',place).length-Z.solar(p.year+'-12-21',place).length;
        const u=document.createElement('p');u.className='hinweis';u.textContent='Im Sommer ist es '+Z.duration(d)+' länger hell.';vb.appendChild(u);}}
  }else vKey='';
  LU.himmel.jahr();
};
})();

/* js/ui/blatt.js */
/* Einstellungen für die Lehrkraft. Öffnen über Knopf und Schieberegler, damit Schüler sie nicht
   aus Versehen öffnen. Das Blatt liegt neben der Uhr (quer) oder im Dock (hoch), nie über der Uhr. */
(function(){
'use strict';
const LU=window.LU,$=LU.$,Z=LU.Z;
const blatt={};LU.blatt=blatt;
let zeigTimer=null;

/* Breite eines Textes in em (Schrift der App), für Mindestbreiten von Knöpfen */
let mess=null;
LU.textEm=function(t){
  if(!mess){mess=document.createElement('canvas').getContext('2d');}
  mess.font='100px Grund,sans-serif';return mess.measureText(t).width/100;
};
/* Einstellungszeile: Bezeichnung in eigener Zeile, darunter die Wahlknöpfe. Die Knöpfe sind mindestens so breit wie
   ihr längstes Wort und brechen bei Platzmangel in die nächste Zeile um; die Schrift bleibt gleich groß.
   optionen: [wert, text, beispiel?] */
function zeile(name,optionen,aktuell,setze,opt={}){
  const z=document.createElement('div');z.className='ezeile'+(opt.voll?' voll':'')+(opt.drittel?' drittel':'');
  const n=document.createElement('div');n.className='name';
  if(opt.bild){const i=document.createElement('img');i.className='symbol';i.src=$('bild-mond').src;i.alt='';n.appendChild(i);}
  n.appendChild(document.createTextNode(name));z.appendChild(n);
  const box=document.createElement('div');box.className='optionen';
  box.setAttribute('role','group');box.setAttribute('aria-label',name);
  let breit=0;
  for(const [,text,bsp] of optionen){
    for(const w of String(text).split(/[\s\u00ad]+/))breit=Math.max(breit,LU.textEm(w));
    if(bsp)for(const w of bsp.split(/\s+/))breit=Math.max(breit,LU.textEm(w)*.84); // Beispiel in kleinerer Schrift
  }
  box.style.setProperty('--min',(breit+.75).toFixed(2)+'em');
  for(const [wert,text,bsp] of optionen){const b=document.createElement('button');b.type='button';b.dataset.wert=String(wert);
    if(bsp){b.classList.add('mit-bsp');const t=document.createElement('span');t.className='name';t.textContent=text;const e=document.createElement('span');e.className='bsp';e.textContent=bsp;b.append(t,e);}
    else b.textContent=text;
    b.setAttribute('aria-pressed',String(wert===aktuell));
    LU.tippen(b,()=>{setze(wert);blatt.zeichne();LU.neu();});box.appendChild(b);}
  z.appendChild(box);return z;
}
LU.SPRECHWEISEN=[['sued','Süddeutsch','„Viertel drei“'],['hoch','Hochdeutsch','„Viertel nach zwei“']];
const quizAendern=(k)=>v=>{if(LU.einst[k]===v)return;if(k==='stufe'){LU.setzeStufe(v);return;}LU.einst[k]=v;LU.quiz.neu();};
const geraet=(k)=>v=>{LU.einst[k]=v;LU.speichern();if(k==='schema')document.documentElement.dataset.schema=v;if(k==='layout')LU.layout(true);};

/* Hilfen auf der Uhr fürs Quiz: quer unter den Reitern, hoch unter den Quiz-Einstellungen */
const QUIZHILFEN=[['stunden','i-stundenzahlen','Stunden\u00adzahlen'],['minuten','i-minutenzahlen','Minuten\u00adzahlen'],['alleMinuten','i-alleminuten','Alle Minuten'],
  ['bereich','i-bereich','Stunden\u00adbereich'],['hervorheben','i-hervorheben','Hervor\u00adheben'],['stundenzeiger','i-stundenzeiger','Stunden\u00adzeiger'],
  ['minutenzeiger','i-minutenzeiger','Minuten\u00adzeiger'],['erklaerung','i-erklaerung','Zeiger erklären']];
function quizHilfen(){
  const box=document.createElement('div');box.id='bl-quizhilfen';box.className='block bl-quizhilfen voll';
  const t=document.createElement('p');t.className='titel klein';t.textContent='Hilfen auf der Uhr';box.appendChild(t);
  const g=document.createElement('div');g.className='bl-hilfen-gitter';g.setAttribute('role','group');g.setAttribute('aria-label','Hilfen im Quiz');
  for(const [k,ik,name] of QUIZHILFEN){
    const b=document.createElement('button');b.type='button';b.className='hilfe';b.dataset.quizhilfe=k;b.setAttribute('aria-pressed',String(LU.quizHilfeAn(k)));
    b.innerHTML=`<svg class="ik"><use href="#${ik}"/></svg><span class="cap">${name}</span>`;
    LU.tippen(b,()=>{LU.schalteQuizHilfe(k);blatt.zeichne();LU.neu();});g.appendChild(b);
  }
  box.appendChild(g);return box;
}

function inhalt(reiter){
  const E=LU.einst,hoch=LU.G.hoch,teile=[];
  if(reiter==='quiz'){
    teile.push(zeile('Lernstufe',Object.entries(LU.STUFEN_KNOPF),E.stufe,quizAendern('stufe'),{voll:true}));
    teile.push(zeile('Antworten',[['leicht','Antwort auswählen'],['schwer','Antwort eingeben']],E.antworten,quizAendern('antworten'),{drittel:true}));
    teile.push(zeile('Aufgabe',[['zahlen','Zahlen'],['worte','Worte']],E.aufgabe,quizAendern('aufgabe'),{drittel:true}));
    teile.push(zeile('Sprechweise',LU.SPRECHWEISEN,E.sprechweise,quizAendern('sprechweise'),{drittel:true}));
  }else if(reiter==='runde'){
    teile.push(zeile('Aufgaben je Runde',[[3,'3'],[5,'5'],[8,'8']],E.runde,quizAendern('runde')));
    teile.push(zeile('Tempo',[['langsam','Langsam'],['mittel','Mittel'],['schnell','Schnell']],E.tempoAblauf,v=>{E.tempoAblauf=v;}));
    teile.push(zeile('Zeitdauer beim Ablauf zeigen',[[false,'aus'],[true,'an']],E.dauerZeigen,v=>{E.dauerZeigen=v;}));
  }else if(reiter==='anzeige'){
    teile.push(zeile('Zeiger sperren',[[false,'aus'],[true,'an']],E.zeigerSperren,v=>{E.zeigerSperren=v;}));
    teile.push(zeile('Sekunden\u00adzeiger bei „Jetzt“',[[false,'aus'],[true,'an']],E.sekundenzeiger,v=>{E.sekundenzeiger=v;}));
    teile.push(zeile('Himmel bei Lernuhr und Quiz',[[true,'an'],[false,'aus']],E.himmel,v=>{E.himmel=v;}));
  }else if(reiter==='sonne'){
    const orte=[['herrieden','Herrieden'],['ansbach','Ansbach'],['berlin','Berlin'],['hamburg','Hamburg'],['munich','München'],['eigen','Eigener Ort']];
    teile.push(zeile('Ort',orte,E.ort,v=>{if(v==='eigen'){blatt.ortBearbeiten();return;}E.ort=v;LU.setzeOrt(Object.assign({},Z.places[v]));},{voll:true}));
    teile.push(zeile('Mond',[[false,'aus'],[true,'an']],E.mond,v=>{E.mond=v;},{bild:true}));
    if(!hoch){const h=document.createElement('p');h.className='hinweis info';h.textContent='Zeiten gelten für freien Horizont. Berge, Häuser und Wetter sind nicht berücksichtigt. Sommer- und Winterzeit gelten für den gewählten Ort.';teile.push(h);}
  }else if(reiter==='geraet'){
    teile.push(zeile('Darstellung',[['auto','Auto'],['tafel','Tafel'],['tablet','Tablet']],E.layout,geraet('layout')));
    teile.push(zeile('Farben',[['hell','Hell'],['kontrast','Kontrast']],E.schema,geraet('schema')));
    teile.push(zeile('Ton',[[true,'an'],[false,'aus']],E.ton,geraet('ton')));
    teile.push(zeile('Lob',[['kurz','kurz'],['fanfare','Fanfare']],E.lob,geraet('lob')));
    teile.push(zeile('Bereichswahl',[[false,'frei'],[true,'gesperrt']],E.bereichSperre,v=>{E.bereichSperre=v;}));
    const z=document.createElement('div');z.className='ezeile';const n=document.createElement('div');n.className='name';n.textContent='Hilfen auf der Uhr (Lernuhr und Quiz)';
    const o=document.createElement('div');o.className='optionen';o.style.setProperty('--min','8em');
    const b=document.createElement('button');b.type='button';b.id='hilfen-zurueck';b.textContent='Zurücksetzen';
    LU.tippen(b,()=>{LU.hilfenZuruecksetzen();b.textContent='zurückgesetzt';LU.neu();});
    o.appendChild(b);z.append(n,o);teile.push(z);
  }
  return teile;
}

/* Eigener Ort mit eigenem Ziffernfeld */
blatt.ortBearbeiten=function(){
  const o=LU.einst.eigenerOrt;
  LU.s.blatt.ort={lat:String(o.lat).replace('.',','),lon:String(o.lon).replace('.',','),zone:o.zone,feld:0,meldung:''};blatt.zeichne();
};
function ortTaste(k){
  const o=LU.s.blatt.ort,f=o.feld?'lon':'lat';
  if(k==='Löschen')o[f]=o[f].slice(0,-1);
  else if(k==='−'){o[f]=o[f].startsWith('-')?o[f].slice(1):'-'+o[f];}
  else if(k===','){if(!o[f].includes(','))o[f]+=',';}
  else if(k==='Übernehmen'){
    const lat=Number(o.lat.replace(',','.')),lon=Number(o.lon.replace(',','.'));
    if(!Number.isFinite(lat)||lat<-89||lat>89){o.meldung='Breitengrad: −89 bis 89';o.feld=0;}
    else if(!Number.isFinite(lon)||lon<-180||lon>180){o.meldung='Längengrad: −180 bis 180';o.feld=1;}
    else{LU.einst.eigenerOrt={lat,lon,zone:o.zone};LU.einst.ort='eigen';LU.setzeOrt({name:'Eigener Ort',lat,lon,zone:o.zone});LU.s.blatt.ort=null;}
  }
  else if(o[f].replace(/[-,]/g,'').length<7)o[f]+=k;
  blatt.zeichne();LU.neu();
}
function ortInhalt(){
  const o=LU.s.blatt.ort,teile=[];
  const kopf=document.createElement('p');kopf.className='hinweis voll'+(o.meldung?'':' leer');kopf.textContent=o.meldung||'Koordinaten eintippen, Zeitzone wählen.';teile.push(kopf);
  const k=document.createElement('div');k.className='koord voll';
  [['Breitengrad','lat'],['Längengrad','lon']].forEach(([n,f],i)=>{const b=document.createElement('button');b.type='button';b.className='feld'+(o.feld===i?' aktiv':'');
    const s=document.createElement('small');s.textContent=n;const v=document.createElement('span');v.textContent=(o[f]||'').replace('-','−');b.append(s,v);
    LU.tippen(b,()=>{o.feld=i;blatt.zeichne();});k.appendChild(b);});
  teile.push(k);
  const zf=document.createElement('div');zf.className='block b-ziffern voll';LU.baueZiffern(zf,'koord',ortTaste);teile.push(zf);
  return teile;
}
function zonen(){
  const o=LU.s.blatt.ort,box=$('bl-zonen');box.replaceChildren();
  const zur=document.createElement('button');zur.type='button';zur.textContent='Zurück';LU.tippen(zur,()=>{LU.s.blatt.ort=null;blatt.zeichne();});box.appendChild(zur);
  for(const [z,n] of LU.ZONEN){const b=document.createElement('button');b.type='button';b.textContent=n;b.setAttribute('aria-pressed',String(o.zone===z));LU.tippen(b,()=>{o.zone=z;blatt.zeichne();});box.appendChild(b);}
}

blatt.oeffnen=function(){
  clearTimeout(zeigTimer);$('entsperren').hidden=true;
  LU.s.blatt={reiter:LU.s.bereich==='quiz'?'quiz':LU.s.bereich==='sonne'?'sonne':'anzeige',ort:null};
  blatt.platziere();blatt.zeichne();LU.neu();
};
blatt.schliessen=function(){LU.s.blatt=null;for(const id of ['blatt-links','blatt-rechts','blatt-dock'])$(id).hidden=true;blatt.platziere();LU.neu();};
blatt.platziere=function(){
  const ablage=$('ablage'),offen=!!LU.s.blatt,hoch=LU.G&&LU.G.hoch;
  for(const id of ['bl-reiter','bl-zonen','bl-inhalt'])ablage.appendChild($(id));
  $('blatt-links').hidden=!offen||hoch;$('blatt-rechts').hidden=!offen||hoch;$('blatt-dock').hidden=!offen||!hoch;
  if(!offen)return;
  const ort=!!LU.s.blatt.ort;
  if(!hoch){$('blatt-links').appendChild($(ort?'bl-zonen':'bl-reiter'));$('blatt-rechts').appendChild($('bl-inhalt'));}
  else{$('blatt-dock').appendChild($(ort?'bl-zonen':'bl-reiter'));$('blatt-dock').appendChild($('bl-inhalt'));}
};
blatt.zeichne=function(){
  if(!LU.s.blatt)return;
  blatt.platziere();
  for(const b of LU.qa('#bl-reiter [data-reiter]'))b.setAttribute('aria-selected',String(b.dataset.reiter===LU.s.blatt.reiter));
  const box=$('bl-inhalt');box.replaceChildren();
  const alt=$('bl-quizhilfen');if(alt)alt.remove();
  if(LU.s.blatt.ort){zonen();for(const t of ortInhalt())box.appendChild(t);}
  else for(const t of inhalt(LU.s.blatt.reiter))box.appendChild(t);
  if(!LU.s.blatt.ort&&LU.s.blatt.reiter==='quiz'){
    const qh=quizHilfen();
    if(LU.G.hoch)box.appendChild(qh);else $('bl-reiter').insertBefore(qh,$('blatt-fertig'));
  }
};

blatt.binden=function(){
  LU.tippen($('einstellungen'),()=>{
    if(LU.s.blatt){blatt.schliessen();return;}
    const e=$('entsperren');e.hidden=!e.hidden;clearTimeout(zeigTimer);
    if(!e.hidden){zeigTimer=setTimeout(()=>{e.hidden=true;knopfZurueck();},6000);}
  });
  for(const b of LU.qa('#bl-reiter [data-reiter]'))LU.tippen(b,()=>{LU.s.blatt.reiter=b.dataset.reiter;LU.s.blatt.ort=null;blatt.zeichne();});
  LU.tippen($('blatt-fertig'),blatt.schliessen);
  // Schieberegler
  const knopf=$('schiebeknopf'),schiene=$('schiene');let zug=null;
  const max=()=>schiene.clientWidth-knopf.offsetWidth-8;
  function knopfZurueck(){knopf.style.transform='';}
  knopf.addEventListener('pointerdown',e=>{if(!e.isPrimary)return;e.preventDefault();zug={id:e.pointerId,x0:e.clientX};try{knopf.setPointerCapture(e.pointerId);}catch(_){}clearTimeout(zeigTimer);});
  knopf.addEventListener('pointermove',e=>{if(!zug||e.pointerId!==zug.id)return;const dx=Math.max(0,Math.min(max(),e.clientX-zug.x0));knopf.style.transform=`translateX(${dx}px)`;zug.dx=dx;});
  const los=e=>{if(!zug||e.pointerId!==zug.id)return;const ok=(zug.dx||0)>=max()*.85;zug=null;knopfZurueck();
    if(ok)blatt.oeffnen();else zeigTimer=setTimeout(()=>{$('entsperren').hidden=true;},6000);};
  knopf.addEventListener('pointerup',los);knopf.addEventListener('pointercancel',los);
  knopf.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();blatt.oeffnen();}});
};
})();

/* js/ui/app.js */
/* Start, Zeichnen, Zeitlauf, Bereichswechsel */
(function(){
'use strict';
const LU=window.LU,$=LU.$,Z=LU.Z;

/* ---------- Zeitlauf: ein Antrieb für Zeigen, Quiz und Sonne ---------- */
let frame=null,vorher=null,liveTimer=null;
LU.animiere=function(a){
  LU.s.anim=a;vorher=null;
  if(frame===null)frame=requestAnimationFrame(schritt);
};
function schritt(ts){
  frame=null;const a=LU.s.anim;if(!a)return;
  if(a.art==='gehe'){ // feste Dauer, weich ein- und ausgeblendet (Zufallszeit)
    if(a.t0==null)a.t0=ts;
    const ruhig=window.matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches;
    const p=ruhig?1:Math.min(1,(ts-a.t0)/a.dauer),e=p<.5?2*p*p:1-Math.pow(-2*p+2,2)/2;
    LU.s.instant=a.von+(a.ziel-a.von)*e;
    if(p>=1){LU.s.instant=a.ziel;LU.s.anim=null;vorher=null;LU.zeichne();return;}
    LU.zeichne();frame=requestAnimationFrame(schritt);return;
  }
  if(vorher!==null&&!a.pause){
    const dt=Math.min((ts-vorher)/1000,.1);
    if(a.art==='lauf'){LU.s.instant+=a.richtung*a.rate*dt*Z.MIN;}
    else{LU.s.instant=Math.min(a.ziel,LU.s.instant+a.rate*dt*Z.MIN);
      if(LU.s.instant>=a.ziel){LU.s.anim=null;vorher=null;LU.zeichne();a.fertig&&a.fertig();return;}}
    LU.grenzen();LU.zeichne();
  }
  vorher=ts;frame=requestAnimationFrame(schritt);
}
LU.stoppeAlles=function(){
  LU.s.anim=null;vorher=null;if(frame!==null){cancelAnimationFrame(frame);frame=null;}
  LU.liveStopp();LU.uhr.abbrechen&&0;
};
/* Echtzeit: im Takt der Sekunde, damit der Sekundenzeiger genau auf den Minutenstrichen springt */
function liveTakt(){
  if(!LU.s.live)return;
  if(!document.hidden){LU.s.instant=Date.now();LU.zeichne();}
  liveTimer=setTimeout(liveTakt,1000-Date.now()%1000+8);
}
LU.liveStart=function(){if(liveTimer)clearTimeout(liveTimer);LU.s.live=true;liveTimer=setTimeout(liveTakt,1000-Date.now()%1000+8);};
LU.liveStopp=function(){LU.s.live=false;if(liveTimer){clearTimeout(liveTimer);liveTimer=null;}};
/* Datum bleibt im Bereich der Vorlage (1900 bis 2100) */
LU.grenzen=function(){
  const p=LU.teile();if(Z.validDate(p.ymd))return;
  LU.stoppeAlles();LU.s.instant=Z.wallToInstant(p.year<1900?'1900-01-01':'2100-12-31',p.year<1900?0:1439,LU.zone());
};
LU.vorZiehen=function(){LU.stoppeAlles();};
LU.zeigerGesperrt=function(){
  if(LU.einst.zeigerSperren)return true;
  if(LU.s.bereich==='quiz'&&LU.quiz.gesperrt())return true;
  return false;
};
LU.setzeOrt=function(ort){
  const p=LU.teile();LU.stoppeAlles();LU.s.place=ort;LU.s.instant=Z.wallToInstant(p.ymd,p.minutes,ort.zone);LU.neu();
};

/* ---------- Lob ---------- */
let lobTimer=null;
LU.lob=function(text){
  const l=$('lob');$('lob-text').textContent=text;l.classList.remove('an');void l.offsetWidth;
  // statt Konfetti: die Uhr leuchtet kurz auf
  const u=$('uhr');u.classList.remove('lob-leuchten');void u.getBoundingClientRect();u.classList.add('lob-leuchten');
  l.classList.add('an');clearTimeout(lobTimer);lobTimer=setTimeout(()=>{l.classList.remove('an');u.classList.remove('lob-leuchten');},1500);
};

/* ---------- Bereich ---------- */
LU.wechsle=function(b){
  if(b===LU.s.bereich)return;
  LU.stoppeAlles();LU.uhr.abbrechen();LU.sprache.stopp();
  LU.s.bereich=b;LU.s.autoHilfe=null;
  if(b==='quiz'&&!LU.s.quiz)LU.quiz.neu();
  if(b==='quiz'&&LU.s.quiz&&['lauf','frage','dauer','gut1','gut2'].includes(LU.s.quiz.phase))LU.quiz.neu();
  if(b!=='sonne')LU.s.sonne.vergleich=false;
  if(LU.s.blatt)LU.blatt.schliessen();
  $('entsperren').hidden=true;
  LU.layout(true);
};

/* ---------- Zeichnen ---------- */
LU.zeichne=function(){
  const s=LU.s,E=LU.einst,b=s.bereich,h=s.hilfen,a=s.autoHilfe||{},app=$('app');
  app.dataset.bereich=b;
  // Kopf
  for(const k of LU.qa('#bereiche [data-bereich]'))k.setAttribute('aria-pressed',String(k.dataset.bereich===b));
  $('bereiche').hidden=E.bereichSperre;$('bereich-name').hidden=!E.bereichSperre;
  $('bereich-name').textContent={zeigen:'Lernuhr',quiz:'Quiz',sonne:'Sonne & Mond'}[b];
  const digitalAn=b==='quiz'?LU.quiz.digitalSichtbar():h.digital;
  const satzAn=b==='quiz'&&!$('kopf-satz').hidden;
  $('digital').classList.toggle('aus',!digitalAn&&!satzAn);
  $('digital-zeit').hidden=satzAn;
  const m=Math.floor(LU.wandMinuten()+1e-6);$('digital-zeit').textContent=LU.label(m);
  $('digital').setAttribute('aria-label',digitalAn?'Uhrzeit '+LU.label(m):'Uhrzeit verdeckt');
  // Uhr
  // Im Quiz verraten Stundenbereich und Hervorheben die Lösung: dort nur als Hilfe nach zwei Fehlversuchen
  const quiz=b==='quiz';
  // Quiz: eigene Hilfen (Quiz-Einstellungen), nach Fehlern zusätzlich die automatische Hilfe
  const q=quiz?LU.quizHilfen:h;
  const sicht={stunden:q.stunden,minuten:q.minuten,alleMinuten:q.alleMinuten,bereich:q.bereich||!!a.bereich,hervorheben:q.hervorheben||!!a.hervorheben,
    stundenzeiger:q.stundenzeiger!==false,minutenzeiger:q.minutenzeiger!==false,vergangen:null};
  if(b==='zeigen'&&s.start!=null)sicht.vergangen={startWand:Z.parts(s.start,LU.zone()).minutes,min:(s.instant-s.start)/Z.MIN};
  if(b==='quiz'&&s.quiz&&s.quiz.start!=null&&(a.vergangen||(s.quiz.phase==='lauf'&&E.dauerZeigen)))
    sicht.vergangen={startWand:Z.parts(s.quiz.start,LU.zone()).minutes,min:(s.instant-s.quiz.start)/Z.MIN};
  app.classList.toggle('gesperrt',LU.zeigerGesperrt());
  LU.uhr.zeichne(sicht);
  // Legende zu den Zeigern (Hilfe „Zeiger erklären“), nur für sichtbare Zeiger
  const leg=$('b-legende');leg.hidden=b==='sonne'||!q.erklaerung;
  leg.querySelector('[data-zeiger="h"]').hidden=!sicht.stundenzeiger;leg.querySelector('[data-zeiger="m"]').hidden=!sicht.minutenzeiger;
  // Himmel
  LU.himmel.zeichne(b==='sonne'||E.himmel,b==='sonne',b==='sonne'&&s.sonne.vergleich);
  // Bereich
  if(b==='zeigen')LU.zeigen.zeichne();
  else if(b==='quiz')LU.quiz.zeichne();
  else LU.sonne.zeichne();
  LU.zeilenAufraeumen();
};

/* ---------- Start ---------- */
function start(){
  LU.laden();LU.voreinstellung();
  document.documentElement.dataset.schema=LU.einst.schema;
  LU.uhr.aufbauen();LU.uhr.binden();
  LU.zeigen.binden();LU.quiz.binden();LU.sonne.binden();LU.blatt.binden();
  LU.setzeStufe(LU.einst.stufe);LU.quiz.neu();
  // Quiz: jedes Mal direkt in die Quiz-Einstellungen, damit die Lehrkraft die Runde festlegt
  for(const k of LU.qa('#bereiche [data-bereich]'))LU.tippen(k,()=>{LU.wechsle(k.dataset.bereich);if(k.dataset.bereich==='quiz')LU.blatt.oeffnen();});
  for(const b of LU.qa('.b-vorlesen button'))b.addEventListener('pointerdown',()=>LU.entsperreMedien());
  // Vollbild nur, wenn der Rahmen es erlaubt
  const vb=$('vollbild'),erlaubt=!!(document.fullscreenEnabled||document.webkitFullscreenEnabled);
  vb.hidden=!erlaubt;
  if(erlaubt){
    LU.tippen(vb,()=>{
      const d=document,an=d.fullscreenElement||d.webkitFullscreenElement;
      try{if(an)(d.exitFullscreen||d.webkitExitFullscreen).call(d);else{const r=d.documentElement;(r.requestFullscreen||r.webkitRequestFullscreen).call(r);}}catch(e){}
    });
    const upd=()=>{const t=(document.fullscreenElement||document.webkitFullscreenElement)?'Vollbild beenden':'Vollbild';vb.querySelector('.txt').textContent=t;vb.setAttribute('aria-label',t);};
    document.addEventListener('fullscreenchange',upd);document.addEventListener('webkitfullscreenchange',upd);
  }
  const neuLayout=()=>LU.layout();
  window.addEventListener('resize',neuLayout);
  window.addEventListener('orientationchange',()=>setTimeout(neuLayout,150));
  if(window.visualViewport)visualViewport.addEventListener('resize',neuLayout);
  if(window.ResizeObserver)new ResizeObserver(neuLayout).observe(document.documentElement);
  document.addEventListener('visibilitychange',()=>{if(!document.hidden&&LU.s.live){LU.s.instant=Date.now();LU.neu();}});
  document.addEventListener('keydown',e=>{if(e.key==='Escape'){if(LU.s.blatt)LU.blatt.schliessen();else{LU.stoppeAlles();LU.neu();}}});
  LU.layout(true);
  if(document.fonts&&document.fonts.ready)document.fonts.ready.then(()=>LU.layout(true));
}
if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',start);else start();
})();

</script>
